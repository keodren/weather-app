name: Deploy Weather App UI

# This tells GitHub to only run the deployment when code is pushed to the main branch
on:
  push:
    branches:
      - main
    # It will ONLY run if files inside the UI worker or dependencies change
    paths:
      - 'workers/weather-app-ui/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Uses standard modern Node version
      
      - name: Upgrade npm to match Turborepo requirement
        run: npm install -g npm@12.0.1

      - name: Install Dependencies
        run: npm install
      
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # This tells Wrangler to execute from inside the API worker directory
          workingDirectory: 'workers/weather-app-ui'